<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Carnet — 걷기 프로토타입 (마레)</title>
  </head>
  <body>
    <div id="map"></div>

    <div id="hud">
      <div class="chips"><b id="clock">10:00</b><span id="money">€80</span><span id="walked">0 m</span><span id="found">0곳 발견</span></div>
      <button id="end">하루 마치기</button>
    </div>
    <div id="toast"></div>
    <div id="hint"></div>

    <section id="card">
      <div class="head"><div id="card-emoji"></div><div><h2 id="card-name"></h2><p id="card-cat"></p></div></div>
      <p id="card-blurb"></p>
      <p id="card-meta"></p>
      <div class="acts"><button id="card-go" class="primary"></button><button id="card-save"></button><button id="card-pass">지나친다</button></div>
    </section>

    <section id="intro">
      <div class="tunnel">
        <p class="line">Ⓜ 1 · Saint-Paul</p>
        <h1>파리, 마레 지구<br />오전 10시</h1>
        <p class="sub">가 보려던 곳이 세 군데 있습니다. 나머지는 걸어 봐야 압니다.</p>
        <button id="go" disabled>지도를 펴는 중…</button>
        <p id="status"></p>
      </div>
    </section>

    <section id="summary">
      <div class="sheet">
        <p class="eyebrow">오늘의 기록</p>
        <h2>마레에서의 하루</h2>
        <p id="sum-stats"></p>
        <h3>걷는 걸 지켜보니</h3>
        <ul id="sum-lines"></ul>
        <h3>들른 곳 · 찜한 곳</h3>
        <ol id="sum-stops"></ol>
        <a id="sum-maps" target="_blank" rel="noopener">이 동선을 구글 지도로 열기 ↗</a>
        <button id="again">다시 걷기</button>
        <p class="fine">가격·소요 시간은 프로토타입용 대략값입니다. 지도 © OpenStreetMap contributors.</p>
      </div>
    </section>
    <script type="module" src="/src/walk/main.ts"></script>
  </body>
</html>
